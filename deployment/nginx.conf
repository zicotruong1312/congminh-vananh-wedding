server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your actual domain

    # Proxy to Node.js backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static frontend files (if Nginx serves directly)
    # Alternatively, the Express server handles this currently. 
    # If using Nginx to serve static files for better performance:
    location / {
        # proxy_pass http://127.0.0.1:3000/; # If routing everything through Node
        
        # Serving static via Nginx (Recommended for prod):
        root /var/www/wedding-invite/frontend; # Update path to actual frontend location
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/wedding-invite/frontend;
        expires max;
        log_not_found off;
    }
}
